			<stop offset="0" stop-color="#111111"/>
			<stop offset="0.14" stop-color="#d42a3c"/>
			<stop offset="0.30" stop-color="#b85a38"/>
			<stop offset="0.45" stop-color="#c03a64"/>
			<stop offset="0.60" stop-color="#6d4fd6"/>
